name: CI

on:
  push:
  pull_request:

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SHAS=$(git rev-list "origin/${BASE_REF}..${SHA}")
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            SHAS=$(git rev-list "${BEFORE_SHA}..${SHA}")
          else
            SHAS="$SHA"
          fi
          if [ -z "$SHAS" ]; then
            echo "No new commits to validate."
            exit 0
          fi
          PATTERN='^(fix|feat|chore|docs|refactor|test|perf|ci|build)(\(.+\))?: .+'
          FAILED=0
          for C in $SHAS; do
            SUBJECT=$(git log -1 --format='%s' "$C")
            if echo "$SUBJECT" | grep -qP "$PATTERN"; then
              echo "OK  $C $SUBJECT"
            else
              echo "BAD $C $SUBJECT"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Commit messages must be 'type: summary' with one of: fix, feat, chore, docs, refactor, test, perf, ci, build. See CONTRIBUTING.md."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest "raylib>=5.5.0" numpy pillow
      - name: Compile sources
        run: python -m compileall .
      - name: Run tests
        run: python -m pytest tests/ -q
